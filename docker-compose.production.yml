# ============================================================
# DocuBrain Frontend — Production Docker Compose
# ============================================================

name: docubrain-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT}
        NEXT_PUBLIC_REVERB_WSS_PORT: ${NEXT_PUBLIC_REVERB_WSS_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME}
    container_name: docubrain-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine "localhost" resolves to ::1 first and
      # the standalone server binds IPv4 only, so localhost gets Connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - docubrain-frontend

networks:
  docubrain-frontend:
    driver: bridge
